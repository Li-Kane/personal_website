services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: personal_website_frontend
    ports:
      - "5173:5173"  # Vite dev server
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevent overwriting node_modules
    networks:
      - app-network
    environment:
      - VITE_SERVER_URL=http://server:3247
      - VITE_WS_URL=ws://server:8080
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: personal_website_server
    ports:
      - "3247:3247"  # Server/iframe port 
      - "8080:8080"  # Websocket port
    volumes:
      - ./server:/server
    networks:
      - app-network
    environment:
      - KARANA_LICENSE_FILE=/opt/kdflex/evaluation.license
    stdin_open: true
    tty: true

networks:
  app-network:
    driver: bridge
    name: personal_website_network
